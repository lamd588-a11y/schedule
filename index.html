<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>姐姐日程 - Jadual Kerja</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="apple-mobile-web-app-title" content="姐姐日程">
<style>
:root{--bg:#fff7ed;--card:#fff;--primary:#ff8a3d;--border:#f3d5b5;--done:#a8e6a3}
body{margin:0;background:var(--bg);font-family:-apple-system,PingFang HK,sans-serif;padding-bottom:110px}
.top{position:sticky;top:0;background:#fff;border-bottom:2.5px solid var(--border);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.card{background:#fff;border:2.5px solid #111;border-radius:18px;padding:14px;margin:14px}
.btn{padding:14px;border-radius:14px;border:none;background:var(--primary);color:#fff;font-weight:900;width:100%}
.task{border-bottom:1.5px dashed var(--border);padding:12px 4px;display:flex;gap:10px;align-items:center}
.chk{width:28px;height:28px;border:2.5px solid #111;border-radius:8px;display:grid;place-items:center}
.chk.done{background:var(--done)}
.badge{background:#fff3d6;border:2px solid #111;border-radius:10px;padding:2px 8px;font-weight:800}
</style>
</head>
<body>
<div class="top"><div><b>每日工作日程</b><div style="font-size:.8rem;color:#888">Jadual Kerja + Menu</div></div><input type="date" id="dayPicker"></div>
<div id="list" style="max-width:520px;margin:0 auto;padding:10px"></div>

<script>
const DEFAULT=[{zh:"掃地和拖地",id:"Menyapu lantai",slot:"Pagi",time:"07:00"},{zh:"準備早餐",id:"Sarapan",slot:"Pagi",time:"07:30"},{zh:"洗衣服",id:"Cuci baju",slot:"Sore",time:"13:00"},{zh:"準備晚餐",id:"Menyiapkan makan malam",slot:"Malam",time:"17:30",linkMenu:true},{zh:"清理廚房",id:"Bersih dapur",slot:"Malam",time:"19:00"}];
let tasks=JSON.parse(localStorage.getItem('jadualTasks')||'null')||DEFAULT.map(t=>({...t,done:false,date:fmt(new Date())}));
let curDate=new Date();
function fmt(d){if(typeof d==='string')return d;return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
dayPicker.valueAsDate=curDate; dayPicker.onchange=e=>{curDate=e.target.valueAsDate;render();}

function toggle(i){tasks[i].done=!tasks[i].done;localStorage.setItem('jadualTasks',JSON.stringify(tasks));render();}
function render(){
 let f=fmt(curDate); let dayTasks=tasks.filter(t=>t.date==f);
 let html='';
 ["Pagi","Sore","Malam"].forEach(slot=>{
  html+=`<div class="card"><b>${slot}</b>`;
  dayTasks.filter(t=>t.slot==slot).forEach(t=>{
   let gi=tasks.indexOf(t);
   let menuBtn=t.linkMenu?`<button onclick="goMenu()" style="margin-left:8px;background:#fff3d6;border:2px solid #111;border-radius:8px;padding:4px 8px;font-weight:800">📖 睇今日菜單 / Lihat Menu</button>`:'';
   html+=`<div class="task"><div class="chk ${t.done?'done':''}" onclick="toggle(${gi})">${t.done?'✓':''}</div><div><b>${t.zh} / ${t.id}</b><div style="font-size:.8rem;color:#888">${t.time}</div>${menuBtn}</div></div>`;
  });
  html+=`</div>`;
 });
 document.getElementById('list').innerHTML=html+`<div class="card"><button class="btn" onclick="goMenu()">🍳 直接去我的菜單 / Buka Aplikasi Menu</button></div>`;
}
function goMenu(){
 // 如果你個菜單檔叫 index.html 或 menu.html，會自動跳
 if(confirm('跳去「我的菜單」睇今日煮咩？ / Buka menu hari ini?')){
  // 試下搵同目錄下嘅菜單
  let possible=["index.html","menu.html","我的菜單.html","Best_Version_27.html"];
  // 預設跳去 index.html，你可以改
  window.location.href="index.html";
 }
}
render();
</script>
</body>
</html>
